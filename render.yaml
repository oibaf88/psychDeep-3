# Render Blueprint for psychDeep-vOG (existing service IDs and database are retained).
# Clinical data remains in the existing Supabase project. Inference uses the
# approved local tunnel or explicitly selected commercial provider. Runpod
# configuration may be staged, but remains hard-disabled.
services:
  - type: web
    name: psychdeep-api
    runtime: docker
    repo: https://github.com/oibaf88/psychDeep-3
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: psychdeep_v12
      - key: MODEL_DEPLOYMENT_ALIAS
        value: local-tunnel
      - key: MODEL_POLICY_VERSION
        value: support-policy-v1
      - key: MODEL_ALLOW_COMMERCIAL
        value: "true"
      - key: RUNPOD_ENABLED
        value: "false"
      # Runpod: configure actual endpoint URL and API key in Render Environment
      # after deployment. On existing Blueprints sync:false does not re-prompt.
      # USER-REQUESTED MODEL: Biomedical Llama 3.1. Exact HF repo and revision
      # are NOT confirmed. Never substitute MedQA or a Llama 3.0 checkpoint.
      # Set model IDs to the exact served /models identifier after verification.
      - key: MODEL_CLOUD_BASE_URL
        sync: false
      - key: MODEL_CLOUD_API_KEY
        sync: false
      - key: MODEL_CLOUD_CHAT_MODEL
        sync: false
      - key: MODEL_CLOUD_ANALYSIS_MODEL
        sync: false
      - key: MODEL_CLOUD_COPILOT_MODEL
        sync: false
      - key: MODEL_CLOUD_TIMEOUT_SECONDS
        value: "180"
      - key: MODEL_CLOUD_MAX_TOKENS
        value: "2048"
      - key: MODEL_LOCAL_BASE_URL
        sync: false
      # cloudflared connector token stays on Windows, never in this Blueprint.
      # Cloudflare Access service credentials are shared, backend-only secrets.
      - key: MODEL_LOCAL_CF_ACCESS_REQUIRED
        value: "true"
      - key: MODEL_LOCAL_CF_ACCESS_HOST
        value: ai.bfab.io
      - key: MODEL_LOCAL_CF_ACCESS_CLIENT_ID
        sync: false
      - key: MODEL_LOCAL_CF_ACCESS_CLIENT_SECRET
        sync: false
      # Do NOT provision MODEL_LOCAL_API_KEY for personal mode. admin_clinical
      # saves an LM Studio token in Mis modelos; it stays on that account.
      # An existing Render shared key may remain only for a reviewed rollback.
      # Preserve this SAME Fernet key across deployments; never regenerate it.
      - key: LLM_USER_CREDENTIALS_KEY
        sync: false
      # The deployed API already runs with this enabled. sync:false keeps the
      # dashboard value from being cleared by a blueprint sync.
      - key: LLM_PERSONAL_MODE
        sync: false
      # Do not pin a model id. Local inference uses the model LM Studio
      # reports as loaded. Several advertised models and no unique loaded
      # model stop inference.
      - key: MODEL_LOCAL_CHAT_MODEL
        sync: false
      - key: MODEL_LOCAL_ANALYSIS_MODEL
        sync: false
      - key: MODEL_LOCAL_COPILOT_MODEL
        sync: false
      - key: MODEL_LOCAL_TIMEOUT_SECONDS
        value: "120"
      - key: MODEL_LOCAL_MAX_TOKENS
        value: "8192"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_CHAT_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_ANALYSIS_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_COPILOT_MODEL
        value: claude-sonnet-4-6
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_COPILOT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_MAX_TOKENS
        value: "8192"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "120"
      - key: OPENAI_CHAT_EFFORT
        value: medium
      - key: OPENAI_ANALYSIS_EFFORT
        value: high
      - key: LLM_DEFAULT_PROVIDER
        value: anthropic
      - key: LLM_OPENAI_COMPATIBLE_BASE_URL
        sync: false
      # Legacy fallback names. Leave unset so a retired model id is not sent.
      - key: LLM_OPENAI_COMPATIBLE_CHAT_MODEL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_ANALYSIS_MODEL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_COPILOT_MODEL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_TIMEOUT_SECONDS
        value: "45"
      - key: LLM_OPENAI_COMPATIBLE_MAX_TOKENS
        value: "8192"
      - key: LLM_ALLOW_RUNTIME_OVERRIDE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://psychdeep-web.onrender.com,https://psychdeep.bfab.io
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: psychapp@bfab.io

  # Long-running, PostgreSQL-backed consumer for analysis, memory and other
  # consent-gated jobs. This is a separate billable Render worker; activating
  # it requires a Blueprint sync after reviewing the worker plan/cost.
  - type: worker
    name: psychdeep-memory-worker
    runtime: docker
    repo: https://github.com/oibaf88/psychDeep-3
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.memory_worker
    plan: 0.5c-512mb
    region: frankfurt
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: psychdeep-api
          envVarKey: DATABASE_URL
      - key: DATABASE_SCHEMA
