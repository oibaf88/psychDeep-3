# Render Blueprint for PsychDeep vNext.
# Clinical data lives in the existing Supabase project. The model alone runs
# locally and is reached over HTTPS through an authenticated tunnel.
services:
  - type: web
    name: psychdeep-api
    runtime: docker
    repo: https://github.com/oibaf88/psychDeep-3
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: psychdeep_v12
      - key: MODEL_DEPLOYMENT_ALIAS
        value: local-tunnel
      - key: MODEL_POLICY_VERSION
        value: support-policy-v1
      - key: MODEL_ALLOW_COMMERCIAL
        value: "true"
      - key: MODEL_LOCAL_BASE_URL
        sync: false
      # cloudflared connector token stays on Windows, never in this Blueprint.
      # Cloudflare Access service credentials are shared, backend-only secrets.
      - key: MODEL_LOCAL_CF_ACCESS_REQUIRED
        value: "true"
      - key: MODEL_LOCAL_CF_ACCESS_HOST
        value: ai.bfab.io
      - key: MODEL_LOCAL_CF_ACCESS_CLIENT_ID
        sync: false
      - key: MODEL_LOCAL_CF_ACCESS_CLIENT_SECRET
        sync: false
      # Do NOT provision MODEL_LOCAL_API_KEY for personal mode: each account
      # saves its own LM Studio token encrypted in Supabase. An existing Render
      # shared key may remain only for an explicitly reviewed legacy rollback.
      # Preserve this SAME Fernet key across deployments; never regenerate it.
      - key: LLM_USER_CREDENTIALS_KEY
        sync: false
      # Enable only after two-account, per-key, cross-account and Access tests.
      - key: LLM_PERSONAL_MODE
        sync: false
      # Use exact model IDs shown by LM Studio /v1/models.
      - key: MODEL_LOCAL_CHAT_MODEL
        sync: false
      - key: MODEL_LOCAL_ANALYSIS_MODEL
        sync: false
      - key: MODEL_LOCAL_COPILOT_MODEL
        sync: false
      - key: MODEL_LOCAL_TIMEOUT_SECONDS
        value: "120"
      - key: MODEL_LOCAL_MAX_TOKENS
        value: "8192"
      # Runpod cloud profile is STAGED ONLY. Do not switch
      # MODEL_DEPLOYMENT_ALIAS before endpoint, privacy, clinical and QA gates.
      # The endpoint and model IDs must come from an actual verified deployment.
      - key: MODEL_CLOUD_BASE_URL
        sync: false
      - key: MODEL_CLOUD_API_KEY
        sync: false
      - key: MODEL_CLOUD_CHAT_MODEL
        sync: false
      - key: MODEL_CLOUD_ANALYSIS_MODEL
        sync: false
      - key: MODEL_CLOUD_COPILOT_MODEL
        sync: false
      - key: MODEL_CLOUD_TIMEOUT_SECONDS
        value: "120"
      - key: MODEL_CLOUD_MAX_TOKENS
        value: "2048"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_DEFAULT_PROVIDER
        value: anthropic
      - key: LLM_OPENAI_COMPATIBLE_BASE_URL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_CHAT_MODEL
        value: gemma-2-2b-it
      - key: LLM_OPENAI_COMPATIBLE_ANALYSIS_MODEL
        value: gemma-2-2b-it
      - key: LLM_OPENAI_COMPATIBLE_COPILOT_MODEL
        value: gemma-2-2b-it
      - key: LLM_OPENAI_COMPATIBLE_TIMEOUT_SECONDS
        value: "45"
      - key: LLM_OPENAI_COMPATIBLE_MAX_TOKENS
        value: "8192"
      - key: LLM_ALLOW_RUNTIME_OVERRIDE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_LOCALE
        value: es-ES
      - key: CORS_ORIGINS
        value: https://psychdeep-web.onrender.com,https://psychdeep.bfab.io
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: psychapp@bfab.io

  - type: web
    name: psychdeep-web
    runtime: static
    repo: https://github.com/oibaf88/psychDeep-3
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(),microphone=(),geolocation=()
