# Render Blueprint for PsychDeep vNext.
# Clinical data lives only in the existing Supabase project. Render hosts the
# cloud API and static web; no Render Postgres/Redis/worker is required in the
# zero-cost prototype stage.
services:
  - type: web
    name: psychdeep-api
    runtime: docker
    repo: https://github.com/oibaf88/psychDeep-3
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      # Existing Supabase pooler URL; TLS/credentials stay in Render secrets.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: psychdeep_v12

      # vNext Model Gateway. local-tunnel is the zero-cost deployment profile.
      # cloud-tuned stays disabled until a separately approved endpoint exists.
      - key: MODEL_DEPLOYMENT_ALIAS
        value: local-tunnel
      - key: MODEL_POLICY_VERSION
        value: support-policy-v1
      - key: MODEL_ALLOW_COMMERCIAL
        value: "false"

      # Optional commercial bridge credential slot retained for compatibility.
      # MODEL_ALLOW_COMMERCIAL=false means the gateway cannot select it.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Transitional server-only aliases for the existing tunnel/model secret.
      # vNext accepts these as compatibility inputs; no runtime DB/UI override
      # can redirect clinical text. Rotate/rename later without domain changes.
      - key: LLM_OPENAI_COMPATIBLE_BASE_URL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_API_KEY
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_CHAT_MODEL
        value: gemma-2-2b-it
      - key: LLM_OPENAI_COMPATIBLE_ANALYSIS_MODEL
        value: gemma-2-2b-it
      - key: LLM_OPENAI_COMPATIBLE_COPILOT_MODEL
        value: gemma-2-2b-it
      - key: LLM_OPENAI_COMPATIBLE_TIMEOUT_SECONDS
        value: "45"
      - key: LLM_OPENAI_COMPATIBLE_MAX_TOKENS
        value: "8192"
      - key: LLM_ALLOW_RUNTIME_OVERRIDE
        value: "false"

      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_LOCALE
        value: es-ES
      - key: CORS_ORIGINS
        value: https://psychdeep-web.onrender.com,https://psychdeep.bfab.io
      - key: SEED_DEMO_DATA
        value: "false"

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: psychapp@bfab.io

  - type: web
    name: psychdeep-web
    runtime: static
    repo: https://github.com/oibaf88/psychDeep-3
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(),microphone=(),geolocation=()
