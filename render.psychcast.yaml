# Blueprint independiente para psychcast.
# El repositorio https://github.com/oibaf88/psychcast debe existir antes de sincronizar.
# No reemplazar el render.yaml de psychDeep ni reutilizar sus secretos, servicios o DB.
services:
  - type: web
    name: psychcast-api
    runtime: docker
    repo: https://github.com/oibaf88/psychcast
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: psychdeep_v12
      - key: MODEL_DEPLOYMENT_ALIAS
        value: local-tunnel
      - key: MODEL_POLICY_VERSION
        value: support-policy-v1
      - key: MODEL_ALLOW_COMMERCIAL
        value: "true"
      - key: RUNPOD_ENABLED
        value: "false"
      - key: MODEL_CLOUD_BASE_URL
        sync: false
      - key: MODEL_CLOUD_API_KEY
        sync: false
      - key: MODEL_CLOUD_CHAT_MODEL
        sync: false
      - key: MODEL_CLOUD_ANALYSIS_MODEL
        sync: false
      - key: MODEL_CLOUD_COPILOT_MODEL
        sync: false
      - key: MODEL_CLOUD_TIMEOUT_SECONDS
        value: "180"
      - key: MODEL_CLOUD_MAX_TOKENS
        value: "2048"
      - key: MODEL_LOCAL_BASE_URL
        sync: false
      - key: MODEL_LOCAL_CF_ACCESS_REQUIRED
        value: "true"
      - key: MODEL_LOCAL_CF_ACCESS_HOST
        value: ai.bfab.io
      - key: MODEL_LOCAL_CF_ACCESS_CLIENT_ID
        sync: false
      - key: MODEL_LOCAL_CF_ACCESS_CLIENT_SECRET
        sync: false
      - key: LLM_USER_CREDENTIALS_KEY
        sync: false
      - key: LLM_PERSONAL_MODE
        sync: false
      - key: MODEL_LOCAL_CHAT_MODEL
        sync: false
      - key: MODEL_LOCAL_ANALYSIS_MODEL
        sync: false
      - key: MODEL_LOCAL_COPILOT_MODEL
        sync: false
      - key: MODEL_LOCAL_TIMEOUT_SECONDS
        value: "120"
      - key: MODEL_LOCAL_MAX_TOKENS
        value: "8192"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_CHAT_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_ANALYSIS_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_COPILOT_MODEL
        value: claude-sonnet-4-6
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_COPILOT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_MAX_TOKENS
        value: "8192"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "120"
      - key: OPENAI_CHAT_EFFORT
        value: medium
      - key: OPENAI_ANALYSIS_EFFORT
        value: high
      - key: LLM_DEFAULT_PROVIDER
        value: anthropic
      - key: LLM_OPENAI_COMPATIBLE_BASE_URL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_CHAT_MODEL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_ANALYSIS_MODEL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_COPILOT_MODEL
        sync: false
      - key: LLM_OPENAI_COMPATIBLE_TIMEOUT_SECONDS
        value: "45"
      - key: LLM_OPENAI_COMPATIBLE_MAX_TOKENS
        value: "8192"
      - key: LLM_ALLOW_RUNTIME_OVERRIDE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://psychcast.bfab.io
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: psychcast@bfab.io
      # New layers are explicitly disabled until implemented, reviewed and tested.
      - key: MEMORY_LAYER_ENABLED
        value: "false"
      - key: MODEL_PREDICTION_ENABLED
        value: "false"

  - type: web
    name: psychcast-web
    runtime: static
    repo: https://github.com/oibaf88/psychcast
    branch: master
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(),microphone=(),geolocation=()
