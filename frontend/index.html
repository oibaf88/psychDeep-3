<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches the page surface, which is the system's darkest ground. -->
    <meta name="theme-color" content="#0f1419" />
    <!-- The one face the system uses. Self-hosted, so this is a same-origin
         hint and no third party learns who opened the app. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Same-origin PsychDeep brand asset. -->
    <link rel="icon" type="image/png" href="/psychDeep%20logo.png" />
    <title>PsychDeep</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
